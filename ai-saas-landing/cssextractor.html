<!DOCTYPE html>
<html>
<head>
  <title>CSS Code Extractor</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    
    header {
      background-color: #333;
      color: #fff;
      padding: 20px;
      text-align: center;
    }
    
    main {
      padding: 20px;
    }
    
    #input-section {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    
    #input-section textarea {
      width: 100%;
      height: 200px;
      resize: vertical;
      border: 1px solid #ccc;
      padding: 10px;
      font-size: 16px;
    }
    
    #output-section {
      display: flex;
      flex-direction: column;
    }
    
    #output-section textarea {
      width: 100%;
      height: 200px;
      resize: vertical;
      border: 1px solid #ccc;
      padding: 10px;
      font-size: 16px;
    }
    
    #extract-button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h1>CSS Code Extractor</h1>
  </header>
  
  <main>
    <div id="input-section">
      <textarea id="source-code" placeholder="Paste your source code here"></textarea>
    </div>
    
    <div id="output-section">
      <textarea id="css-code" placeholder="Extracted CSS code will appear here" readonly></textarea>
      <button id="extract-button">Extract CSS</button>
    </div>
  </main>
  
  <script>
    const extractButton = document.getElementById('extract-button');
    const sourceCode = document.getElementById('source-code');
    const cssCode = document.getElementById('css-code');
    
    extractButton.addEventListener('click', () => {
      const regex = /<style[^>]*>(.*?)<\/style>/gs;
      const matches = sourceCode.value.match(regex);
      
      if (matches) {
        const extractedCSS = matches.map(match => match.replace(/<\/?style[^>]*>/g, '')).join('\n');
        cssCode.value = extractedCSS;
      } else {
        cssCode.value = 'No CSS code found in the source code.';
      }
    });
  </script>
</body>
</html>
