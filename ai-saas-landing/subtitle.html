<!DOCTYPE html>
<html>
<head>
  <title>Subtitle Generator</title>
  <style>
    #video-container {
      margin-bottom: 20px;
    }

    #subtitle-container {
      width: 100%;
      height: 200px;
      overflow-y: scroll;
      border: 1px solid #ccc;
      padding: 10px;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>
  <h1>Subtitle Generator</h1>

  <div id="video-container">
    <input type="file" accept="video/*" id="video-input" onchange="loadVideo(event)" />
    <video id="video-player" controls></video>
  </div>

  <div id="subtitle-container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/vtt.js/2.0.0/vtt.min.js"></script>
  <script>
    function loadVideo(event) {
      const videoInput = event.target;
      const videoPlayer = document.getElementById('video-player');
      const subtitleContainer = document.getElementById('subtitle-container');

      const file = videoInput.files[0];
      const fileURL = URL.createObjectURL(file);

      videoPlayer.src = fileURL;

      videoPlayer.addEventListener('timeupdate', function() {
        const currentTime = videoPlayer.currentTime;

        // Your logic to generate subtitles based on the current time
        const subtitleText = generateSubtitleText(currentTime);

        subtitleContainer.textContent = subtitleText;
      });
    }

    function generateSubtitleText(currentTime) {
      // Placeholder logic to generate subtitles
      // You can replace this with your own logic to generate subtitles
      if (currentTime < 5) {
        return 'Subtitle 1';
      } else if (currentTime < 10) {
        return 'Subtitle 2';
      } else if (currentTime < 15) {
        return 'Subtitle 3';
      } else {
        return 'No subtitle available';
      }
    }

    function exportSubtitles() {
      const videoPlayer = document.getElementById('video-player');
      const subtitleText = document.getElementById('subtitle-container').textContent;

      const cues = [
        new VTTCue(0, videoPlayer.duration, subtitleText)
      ];

      const vttFile = new WebVTT.TextTrackCueList(cues);
      const vttBlob = new Blob([vttFile], { type: 'text/vtt' });
      const vttURL = URL.createObjectURL(vttBlob);

      const link = document.createElement('a');
      link.href = vttURL;
      link.download = 'subtitles.srt';
      link.click();
    }
  </script>

  <button onclick="exportSubtitles()">Export Subtitles</button>
</body>
</html>
