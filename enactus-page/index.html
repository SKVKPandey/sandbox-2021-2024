<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Model</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-gap: 10px;
        }
        .items{
            border: 3px black solid;
        }
        #item-1{
            grid-row-start: 1;
            grid-row-end: 7;
            grid-column-start: 1;
            grid-column-end: 3;
            text-align: center;
        }
        #item-2{
            grid-row-start: 1;
            grid-row-end: 4;
            grid-column-start: 3;
            grid-column-end: 5;
            text-align: center;
        }
        #item-3{
            grid-row-start: 1;
            grid-row-end: 5;
            grid-column-start: 5;
            grid-column-end: 7;
            text-align: center;
        }
        #item-4{
            grid-row-start: 1;
            grid-row-end: 4;
            grid-column-start: 7;
            grid-column-end: 9;
            text-align: center;
        }
        #item-5{
            grid-row-start: 1;
            grid-row-end: 7;
            grid-column-start: 9;
            grid-column-end: 11;
            text-align: center;
        }
        #item-6{
            grid-row-start: 4;
            grid-row-end: 7;
            grid-column-start: 3;
            grid-column-end: 5;
            text-align: center;
        }
        #item-7{
            grid-row-start: 5;
            grid-row-end: 7;
            grid-column-start: 5;
            grid-column-end: 7;
            text-align: center;
        }
        #item-8{
            grid-row-start: 4;
            grid-row-end: 7;
            grid-column-start: 7;
            grid-column-end: 9;
            text-align: center;
        }
        #item-9{
            grid-row-start: 7;
            grid-row-end: 10;
            grid-column-start: 1;
            grid-column-end: 6;
            text-align: center;
        }
        #item-10{
            grid-row-start: 7;
            grid-row-end: 10;
            grid-column-start: 6;
            grid-column-end: 11;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="items" id="item-1">Key Partners</div>
        <div class="items" id="item-2">Key Activities</div>
        <div class="items" id="item-3">Cost Structure</div>
        <div class="items" id="item-4">SDGS Promoted</div>
        <div class="items" id="item-5">Customer Segment</div>
        <div class="items" id="item-6">Key Resources</div>
        <div class="items" id="item-7"></div>
        <div class="items" id="item-8">Future Prospects</div>
        <div class="items" id="item-9">Value Propositions</div>
        <div class="items" id="item-10">Revenue Streams</div>
    </div>
</body>
</html>
