<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Music Generation</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    button {
      padding: 16px 32px;
      font-size: 24px;
    }
  </style>
</head>
<body>
  <button id="generateButton">Generate Music</button>

  <script>
    const generateButton = document.getElementById('generateButton');
    
    generateButton.addEventListener('click', () => {
      // Send a message to the main process to generate music
      window.api.send('generate-music');
    });
  </script>
</body>
</html>
