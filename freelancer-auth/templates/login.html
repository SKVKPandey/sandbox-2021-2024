				<form class="login100-form validate-form flex-sb flex-w" method = "post" action="/email_verification">
					<span class="login100-form-title p-b-15">
						Email Verification
					</span>
					
					<div class="p-t-31 p-b-9">
						<span class="txt1">
							Email
						</span>
					</div>

					<div class="wrap-input100 validate-input" data-validate = "Email is required">
						<input class="input100" type="text" id="email" name="email" >
						<span class="focus-input100"></span>
					</div>

					<div class="container-login100-form-btn m-t-17">
						<button class="login100-form-btn" type="submit">
							Verify
						</button>
					</div>

					<div class="w-full text-center p-t-12">
						<p style="color: red">{{data}}</p>
					</div>

					<div class="w-full text-center p-t-12">
						<span class="txt2">
							Not a member?
						</span>

						<a href="{{url_for('register')}}" class="txt2 bo1">
