<!DOCTYPE html>
<html lang="en">
<head>
	<title>Register</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

<!--===============================================================================================-->	
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
<!--===============================================================================================-->
	<link rel="icon" type="image/png" href="{{ url_for('static',filename='images/icons/register.ico') }}"/>
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="{{ url_for('static',filename='vendor/bootstrap/css/bootstrap.min.css') }}">
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="{{ url_for('static',filename='fonts/font-awesome-4.7.0/css/font-awesome.min.css') }}">
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="{{ url_for('static',filename='fonts/Linearicons-Free-v1.0.0/icon-font.min.css') }}">
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="{{ url_for('static',filename='vendor/animate/animate.css') }}">
<!--===============================================================================================-->	
	<link rel="stylesheet" type="text/css" href="{{ url_for('static',filename='vendor/css-hamburgers/hamburgers.min.css') }}">
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="{{ url_for('static',filename='vendor/animsition/css/animsition.min.css') }}">
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="{{ url_for('static',filename='vendor/select2/select2.min.css') }}">
<!--===============================================================================================-->	
	<link rel="stylesheet" type="text/css" href="{{ url_for('static',filename='vendor/daterangepicker/daterangepicker.css') }}">
<!--===============================================================================================-->
	<link rel="stylesheet" type="text/css" href="{{ url_for('static',filename='css/util.css') }}">
	<link rel="stylesheet" type="text/css" href="{{ url_for('static',filename='css/main.css') }}">
<!--===============================================================================================-->
</head>
<body>
	
	<div class="limiter">
		<nav class="navbar navbar-expand-lg navbar-dark bg-dark" style="padding: 1%">
    
			<div class="collapse navbar-collapse" id="navbarColor01">
				<ul class="navbar-nav mr-auto">
				  <li class="nav-item active">
					<a class="nav-link" href="#">Home</a>
				  </li>
				  <li class="nav-item">
					<a class="nav-link" href="#">Features</a>
				  </li>
				  <li class="nav-item">
					<a class="nav-link" href="{{url_for('login')}}">Login</a>
				  </li>
				  <li class="nav-item">
					  <a class="nav-link" href="{{url_for('register')}}">Register</a>
					</li>
				  <li class="nav-item">
					<a class="nav-link" href="#">About</a>
				  </li>
				</ul>
			</div>
		</nav>
		<div class="container-login100" style="background-image: url('{{ url_for('static',filename='images/bg-01.jpg') }}');">
			<div class="wrap-login100 p-l-110 p-r-110 p-t-62 p-b-33">
				<form class="login100-form validate-form flex-sb flex-w" method = "post" action="/register_validation">
					
					<div class="p-t-31 p-b-9">
						<span class="txt1">
							First Name
						</span>
					</div>

					<div class="wrap-input100 validate-input" data-validate = "First name is required">
						<input class="input100" type="" id="fname" name="fname" >
						<span class="focus-input100"></span>
					</div>

					<div class="p-t-31 p-b-9">
						<span class="txt1">
							Last Name
						</span>
					</div>

					<div class="wrap-input100 validate-input" data-validate = "Last name is required">
						<input class="input100" type="" id="lname" name="lname" >
						<span class="focus-input100"></span>
					</div>

					<div class="p-t-31 p-b-9">
						<span class="txt1">
							 Contact No.
						</span>
					</div>

					<div class="wrap-input100 validate-input" data-validate = "Contact No. is required">
						<input class="input100" type="" id="contact" name="contact" >
						<span class="focus-input100"></span>
					</div>

					<div class="p-t-31 p-b-9">
						<span class="txt1">
							 Email ID
						</span>
					</div>

					<div class="wrap-input100 validate-input" data-validate = "Email is required">
						<input class="input100" type="" id="email" name="email" >
						<span class="focus-input100"></span>
					</div>

					<div class="p-t-31 p-b-9">
						<span class="txt1">
							 Password
						</span>
					</div>

					<div class="wrap-input100 validate-input" data-validate = "Password is required">
						<input class="input100" type="password" id="pswd" name="pswd" >
						<span class="focus-input100"></span>
					</div>

					<div class="p-t-31 p-b-9">
						<span class="txt1">
							 Password Color
						</span>
					</div>

					<div class="p-t-31 p-b-9">
                        &nbsp;&nbsp;&nbsp;&nbsp;
						<select name="pcolor" id="pcolor" onchange="colorFunction()">
							<option value="nocolor">--Select Color--</option>
							<option value="cyan">Cyan</option>
							<option value="purple">Purple</option>
							<option value="violet">Violet</option>
							<option value="blue">Blue</option>
							<option value="green">Green</option>
							<option value="yellow">Yellow</option>
							<option value="orange">Orange</option>
							<option value="red">Red</option>
							<option value="pink">Pink</option>
							<option value="brown">Brown</option>
							<option value="gray">Gray</option>
							<option value="black">Black</option>
						</select>
                        &nbsp;&nbsp;&nbsp;&nbsp;
					</div>

					<div class="p-t-31 p-b-9">
						<div id="box">
							No Color Selected
						</div>
					</div>

                    <div style="margin: 0 auto;">
						<p style="color: red;">{{data}}</p>
					</div>
					
					<div class="container-login100-form-btn m-t-17">
						<button class="login100-form-btn" type="submit">
							Submit
						</button>
					</div>

				</form>
			</div>
		</div>
	</div>
	

	<div id="dropDownSelect1"></div>
	
<!--===============================================================================================-->
<script src="{{ url_for('static',filename='vendor/jquery/jquery-3.2.1.min.js') }}"></script>
<!--===============================================================================================-->
	<script src="{{ url_for('static',filename='vendor/animsition/js/animsition.min.js') }}"></script>
<!--===============================================================================================-->
	<script src="{{ url_for('static',filename='vendor/bootstrap/js/popper.js') }}"></script>
	<script src="{{ url_for('static',filename='vendor/bootstrap/js/bootstrap.min.js') }}"></script>
<!--===============================================================================================-->
	<script src="{{ url_for('static',filename='vendor/select2/select2.min.js') }}"></script>
<!--===============================================================================================-->
	<script src="{{ url_for('static',filename='vendor/daterangepicker/moment.min.js') }}"></script>
	<script src="{{ url_for('static',filename='vendor/daterangepicker/daterangepicker.js') }}"></script>
<!--===============================================================================================-->
	<script src="{{ url_for('static',filename='vendor/countdowntime/countdowntime.js') }}"></script>
<!--===============================================================================================-->
	<script src="{{ url_for('static',filename='js/main.js') }}"></script>
<!--===============================================================================================-->
	<script>
		function colorFunction() {
			if (document.getElementById("pcolor").value == 'nocolor') {
				document.getElementById("box").innerHTML = "No Color Selected";
				document.getElementById("box").style.backgroundColor = 'transparent';
			}
			else {
				document.getElementById("box").style.color = document.getElementById("pcolor").value;
				document.getElementById("box").style.backgroundColor = document.getElementById("pcolor").value;
			}
		}
	</script>

</body>
</html>
